<!DOCTYPE html>
<html>
<head>
  <title>Stick Figure Fighters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    h1 {
      color: #FFFFFF;
      margin-bottom: 5px;
      font-size: 2em;
    }
    .version-info {
      color: #CCCCCC;
      font-size: 14px;
      margin-bottom: 10px;
      text-align: center;
    }
    #canvas {
      border: 3px solid #333;
      background: #FFFFFF;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      outline: none;
      max-width: 100%;
      height: auto;
      display: block;
    }
    .info {
      margin-top: 20px;
      color: #FFFFFF;
      text-align: center;
    }
    .controls {
      margin-top: 20px;
      color: #FFFFFF;
      text-align: center;
      font-size: 12px;
      max-width: 100%;
      padding: 0 10px;
      word-wrap: break-word;
    }
    .credits {
      margin-top: 10px;
      color: #FFFFFF;
      text-align: center;
      font-size: 12px;
      font-style: italic;
      max-width: 100%;
      padding: 0 10px;
      word-wrap: break-word;
    }
    
    /* Responsive styles for tablets and smaller screens */
    @media screen and (max-width: 1024px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 1.5em;
      }
      .version-info {
        font-size: 12px;
      }
      .controls {
        font-size: 11px;
        margin-top: 15px;
      }
      .credits {
        font-size: 11px;
      }
    }
    
    /* Responsive styles for portrait tablets and phones */
    @media screen and (max-width: 768px) {
      body {
        padding: 5px;
      }
      h1 {
        font-size: 1.2em;
        margin-bottom: 3px;
      }
      .version-info {
        font-size: 10px;
        margin-bottom: 5px;
      }
      #canvas {
        border-width: 2px;
      }
      .controls {
        font-size: 10px;
        margin-top: 10px;
        line-height: 1.4;
      }
      .credits {
        font-size: 10px;
        margin-top: 5px;
      }
    }
    
    /* Responsive styles for small phones */
    @media screen and (max-width: 480px) {
      h1 {
        font-size: 1em;
      }
      .version-info {
        font-size: 9px;
      }
      .controls {
        font-size: 9px;
        line-height: 1.3;
      }
      .credits {
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <h1>Stick Figure Fighters</h1>
  <div class="version-info" id="version-info"></div>
  <canvas id="canvas" width="1200" height="600" tabindex="0"></canvas>
  <div class="controls" id="controls"></div>
  <div class="credits">Created with Cursor by Jasper Darji, age 11. With help from Dad, age old.</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Stick Figure Class - Profile view with karate moves
    class StickFigure {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.frame = 0;
        this.baseY = y;
        this.waistY = y + 55;
        this.speed = 2; // Horizontal movement speed
        this.currentMove = 'ready'; // Current karate move
        this.moveTimer = 0;
        this.moveDuration = 60; // Frames per move
        this.jumpOffset = 0; // Vertical offset for jumping
        this.rotation = 0; // Rotation for tumble
        this.soundText = ''; // Sound effect text to display
        this.soundTimer = 0; // Timer for sound effect display
        this.soundDuration = 60; // 1 second at 60fps (persist for 1 second)
        this.soundFadeDuration = 30; // 0.5 seconds fade out
        this.keys = {}; // Track pressed keys
        this.isMoving = false; // Track if fighter is moving horizontally
        this.health = 100; // Health bar
        this.maxHealth = 100;
        this.stunnedTimer = 0; // Timer for stun after lightning hit
        this.stunDuration = 180; // 3 seconds at 60fps
        this.hitTimer = 0; // Timer for hit effect from enemy punches
        this.yellowParticles = []; // Yellow pixels that fall when hit by lightning
        this.isDead = false; // Death state
        this.deathParticles = []; // Particles for death explosion
        this.deathTimer = 0; // Timer for death animation
        this.knives = []; // Knives thrown by fighter
        this.zKeyPressed = false; // Track if Z key is currently pressed (to prevent continuous throws)
        this.radioactiveVomit = []; // Radioactive vomit projectiles
        this.vomitParticles = []; // Persistent vomit particles on ground
        this.waterParticles = []; // Water particles from trident attack
      }
      
      // Karate move types
      getRandomMove() {
        const moves = ['punch', 'kick', 'spinKick', 'block', 'uppercut', 'jump', 'tumble', 'lieDown', 'ready'];
        return moves[Math.floor(Math.random() * moves.length)];
      }
      
      // Check if current move should stop horizontal movement
      shouldStopMoving() {
        return ['kick', 'spinKick', 'jump', 'tumble', 'lieDown'].includes(this.currentMove);
      }
      
      // Trigger a random action (excludes jump and lieDown - those are arrow key actions)
      triggerRandomAction() {
        // Actions available for spacebar (exclude jump and lieDown)
        const actionMoves = ['punch', 'kick', 'spinKick', 'block', 'uppercut', 'tumble'];
        this.currentMove = actionMoves[Math.floor(Math.random() * actionMoves.length)];
        this.moveTimer = 0;
        this.moveDuration = 40 + Math.random() * 40; // Random duration between moves
        // Reset offsets when changing moves
        this.jumpOffset = 0;
        this.rotation = 0;
        
        // Trigger sound effects for certain moves (reduced frequency)
        this.triggerSoundEffect(this.currentMove);
      }
      
      // Trigger sound effect for moves (only on actions, 1 out of 5 chance)
      triggerSoundEffect(move) {
        // Only trigger on actions, not on 'ready' stance
        if (move === 'ready') {
          return;
        }
        
        // Only trigger sound effects 1 out of 5 times (20% chance)
        if (Math.random() > 0.2) {
          return;
        }
        
        // Expanded sound effects - dozen more added
        const allSoundEffects = [
          'Hiyahhh!', 'Hya!', 'Hiya!', 'Hah!', 'Hup!', 'Hyaa!', 'Upp!', 'Whoa!',
          'Hiyah!', 'Whaa!', 'Yah!', 'Hoo!', 'Hahh!', 'Hyah!', 'Wah!', 'Hooah!',
          'Yahh!', 'Hiyahh!', 'Hyaah!', 'Whaah!', 'Hooahh!', 'Yahhh!', 'Hiyahhhh!', 'Hyaaa!'
        ];
        
        // Pick a random sound effect
        this.soundText = allSoundEffects[Math.floor(Math.random() * allSoundEffects.length)];
        this.soundTimer = 0;
      }
      
      update() {
        // Check for death
        if (this.health <= 0 && !this.isDead) {
          this.explode();
        }
        
        // If dead, only update death particles
        if (this.isDead) {
          this.updateDeathParticles();
          return;
        }
        
        // Update stun timer
        if (this.stunnedTimer > 0) {
          this.stunnedTimer--;
        }
        
        // Track if fighter is moving horizontally
        this.isMoving = false;
        
        // Move based on keyboard input (unless stunned, doing a move that stops movement)
        if (!this.shouldStopMoving() && this.stunnedTimer === 0) {
          // WASD movement (only horizontal now)
          if (this.keys['a'] || this.keys['A']) {
            this.x -= this.speed;
            this.isMoving = true;
          }
          if (this.keys['d'] || this.keys['D']) {
            this.x += this.speed;
            this.isMoving = true;
          }
        }
        
        // Update yellow particles
        this.updateYellowParticles();
        
        // Update knives
        this.updateKnives();
        
        // Update radioactive vomit
        this.updateRadioactiveVomit();
        
        // Update persistent vomit particles
        this.updateVomitParticles();
        
        // Update water particles from trident attack
        if (this.currentMove === 'trident' && enemy) {
          this.createWaterParticles(enemy);
        }
        // Always update water particles (even after attack ends) so they disappear properly
        if (enemy) {
          this.updateWaterParticles(enemy);
        }
        
        // Check if enemy is punching and hitting fighter
        if (enemy && !enemy.isDead) {
          const punchMoves = ['punch', 'uppercut'];
          const enemyIsPunching = punchMoves.includes(enemy.currentMove);
          const enemyMoveFrame = enemy.moveTimer / enemy.moveDuration;
          const enemyPunchIntensity = enemyIsPunching ? Math.sin(enemyMoveFrame * Math.PI) : 0;
          
          // Calculate enemy punch reach (enemy punches left, fighter is to the left)
          const enemyPunchReach = enemyIsPunching ? 15 + enemyPunchIntensity * 25 : 0;
          const fighterLeftEdge = this.x; // Fighter is right-facing, so left edge is at x
          const enemyPunchEnd = enemy.x - enemyPunchReach; // Enemy punches left (negative direction)
          
          // Check if enemy punch connects (enemy punches left, fighter is to the left)
          const enemyHitNow = enemyIsPunching && enemyPunchIntensity > 0.4 && enemyPunchEnd <= fighterLeftEdge + 30 && enemyPunchEnd >= fighterLeftEdge - 15;
          
          // Create particles when hit (only if not already in hit state)
          if (enemyHitNow && this.hitTimer === 0) {
            this.hitTimer = 10; // Same hit duration as enemy
            this.health = Math.max(0, this.health - 5); // Same damage as fighter's punches
          }
        }
        
        // Update hit timer
        if (this.hitTimer > 0) {
          this.hitTimer--;
        }
        
        // Keep fighter on screen horizontally
        if (this.x < -50) {
          this.x = -50;
        }
        if (this.x > canvas.width + 50) {
          this.x = canvas.width + 50;
        }
        
        // Advance animation frame
        this.frame += 0.1;
        
        // Update move timer and change move when it expires
        this.moveTimer++;
        if (this.moveTimer > this.moveDuration) {
          // Return to ready stance when move completes
          this.currentMove = 'ready';
          this.moveTimer = 0;
          this.moveDuration = 60;
          // Reset offsets when changing moves
          this.jumpOffset = 0;
          this.rotation = 0;
        }
        
        // Trigger sound effect at the start of moves (frequency already reduced in triggerSoundEffect)
        if (this.moveTimer === 1) {
          this.triggerSoundEffect(this.currentMove);
        }
        
        // Update sound effect timer
        if (this.soundText) {
          this.soundTimer++;
          // Persist for 1 second, then fade out
          if (this.soundTimer > this.soundDuration + this.soundFadeDuration) {
            this.soundText = '';
            this.soundTimer = 0;
          }
        }
        
        // Calculate move-specific offsets
        const moveFrame = this.moveTimer / this.moveDuration;
        
        if (this.currentMove === 'jump') {
          // Jump animation - up then down
          this.jumpOffset = Math.sin(moveFrame * Math.PI) * -40;
          this.swayOffsetY = 0;
          this.swayOffsetX = 0;
        } else if (this.currentMove === 'tumble') {
          // Tumble rotation
          this.rotation = moveFrame * Math.PI * 2; // Full rotation
          this.swayOffsetY = 0;
          this.swayOffsetX = 0;
        } else {
          // Normal sway offsets
          this.swayOffsetY = Math.sin(this.frame) * 1;
          this.swayOffsetX = Math.cos(this.frame * 0.8) * 1;
          this.jumpOffset = 0;
          this.rotation = 0;
        }
      }
      
      draw() {
        // If dead, only draw death particles
        if (this.isDead) {
          this.drawDeathParticles();
          return;
        }
        
        ctx.save(); // Save canvas state
        
        // Apply rotation for tumble
        if (this.currentMove === 'tumble') {
          ctx.translate(this.x, this.baseY + 30); // Rotate around center of body
          ctx.rotate(this.rotation);
          ctx.translate(-this.x, -(this.baseY + 30)); // Translate back
        }
        
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        const waistX = this.x;
        const waistY = this.waistY + this.jumpOffset;
        let upperBodyX = this.x + (this.swayOffsetX || 0);
        let upperBodyY = this.baseY + (this.swayOffsetY || 0) + this.jumpOffset;
        
        // Adjust position for lieDown (3 stages: sitting -> partially lying -> fully down)
        if (this.currentMove === 'lieDown') {
          const lieDownProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0; // 0 to 1, prevent division by zero
          const stage = lieDownProgress < 0.33 ? 1 : (lieDownProgress < 0.66 ? 2 : 3); // Stage 1, 2, or 3
          
          if (stage === 1) {
            // Stage 1: Sitting - body angled back, head higher
            upperBodyX = this.x + 10;
            upperBodyY = this.baseY + 55 + 15 - (lieDownProgress / 0.33) * 10; // Gradually lower
          } else if (stage === 2) {
            // Stage 2: Partially lying - body more horizontal
            const stage2Progress = (lieDownProgress - 0.33) / 0.33; // 0 to 1 within stage 2
            upperBodyX = this.x + 10 + stage2Progress * 5; // Move forward
            upperBodyY = this.baseY + 55 + 5 - stage2Progress * 5; // Lower to ground
          } else {
            // Stage 3: Fully down - body horizontal on ground
            upperBodyX = this.x + 15;
            upperBodyY = this.baseY + 55 + 25 - 5; // On ground level
          }
        }
        
        // Head
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(upperBodyX, upperBodyY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Eye
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(upperBodyX + 3, upperBodyY, 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Body - 3 stages for lieDown, vertical otherwise
        let actualWaistX = waistX;
        let actualWaistY = waistY;
        if (this.currentMove === 'lieDown') {
          const lieDownProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0; // 0 to 1, prevent division by zero
          const stage = lieDownProgress < 0.33 ? 1 : (lieDownProgress < 0.66 ? 2 : 3);
          
          if (stage === 1) {
            // Stage 1: Sitting - body angled back
            const stage1Progress = lieDownProgress / 0.33; // 0 to 1 within stage 1
            const angle = Math.PI / 4 - stage1Progress * (Math.PI / 4); // 45 degrees to 0 degrees
            const bodyLength = 35;
            actualWaistX = upperBodyX + Math.cos(angle) * bodyLength;
            actualWaistY = upperBodyY + Math.sin(angle) * bodyLength;
            ctx.beginPath();
            ctx.moveTo(upperBodyX + 12, upperBodyY);
            ctx.lineTo(actualWaistX, actualWaistY);
            ctx.stroke();
          } else if (stage === 2) {
            // Stage 2: Partially lying - body transitioning to horizontal
            const stage2Progress = (lieDownProgress - 0.33) / 0.33; // 0 to 1 within stage 2
            actualWaistX = upperBodyX + 35 + stage2Progress * 10; // Gradually extend horizontally
            actualWaistY = upperBodyY + (1 - stage2Progress) * 5; // Gradually lower to same level
            ctx.beginPath();
            ctx.moveTo(upperBodyX + 12, upperBodyY);
            ctx.lineTo(actualWaistX, actualWaistY);
            ctx.stroke();
          } else {
            // Stage 3: Fully down - body horizontal
            actualWaistX = upperBodyX + 45;
            actualWaistY = upperBodyY;
            ctx.beginPath();
            ctx.moveTo(upperBodyX + 12, upperBodyY);
            ctx.lineTo(actualWaistX, actualWaistY);
            ctx.stroke();
          }
        } else {
          // Body vertical normally
          ctx.beginPath();
          ctx.moveTo(upperBodyX, upperBodyY + 12);
          ctx.lineTo(waistX, waistY);
          ctx.stroke();
        }
        
        // Draw karate move based on current move
        this.drawKarateMove(upperBodyX, upperBodyY, waistX, waistY);
        
        // Legs - different behavior for different moves
        if (this.currentMove === 'kick' || this.currentMove === 'spinKick') {
          const moveFrame = this.moveTimer / this.moveDuration;
          const kickIntensity = Math.sin(moveFrame * Math.PI);
          
          if (this.currentMove === 'spinKick') {
            // Spin kick - leg extends outward and rotates
            const spinAngle = moveFrame * Math.PI * 2;
            const kickLength = 30 + kickIntensity * 20;
            const kickX = waistX + Math.cos(spinAngle) * kickLength;
            const kickY = waistY + Math.sin(spinAngle) * kickLength;
            
            // Supporting leg
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(waistX - 8, waistY + 25);
            ctx.stroke();
            
            // Spinning leg
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(kickX, kickY);
            ctx.stroke();
          } else {
            // Regular kick
            // Back leg (supporting leg)
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(waistX - 8, waistY + 25);
            ctx.stroke();
            
            // Front leg kicks forward and up
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(waistX + 20 + kickIntensity * 25, waistY + 15 - kickIntensity * 20);
            ctx.stroke();
          }
        } else if (this.currentMove === 'jump') {
          // Jump - legs tucked up
          const moveFrame = this.moveTimer / this.moveDuration;
          const tuckAmount = Math.sin(moveFrame * Math.PI) * 15;
          
          // Front leg
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX + 8, waistY + 15 - tuckAmount);
          ctx.stroke();
          
          // Back leg
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX - 6, waistY + 15 - tuckAmount);
          ctx.stroke();
        } else if (this.currentMove === 'tumble') {
          // Tumble - legs extended during rotation
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX + 10, waistY + 20);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX - 10, waistY + 20);
          ctx.stroke();
        } else if (this.currentMove === 'lieDown') {
          // Lie down - legs 3 stages
          const lieDownProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0; // Prevent division by zero
          const stage = lieDownProgress < 0.33 ? 1 : (lieDownProgress < 0.66 ? 2 : 3);
          
          // Use the waist position calculated in body drawing
          const lieDownWaistX = actualWaistX;
          const lieDownWaistY = actualWaistY;
          
          if (stage === 1) {
            // Stage 1: Sitting - legs bent in front
            const stage1Progress = lieDownProgress / 0.33;
            // Left leg - bent forward
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX + 15 - stage1Progress * 10, lieDownWaistY + 20 - stage1Progress * 15);
            ctx.stroke();
            // Right leg - bent forward
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX + 18 - stage1Progress * 12, lieDownWaistY + 18 - stage1Progress * 12);
            ctx.stroke();
          } else if (stage === 2) {
            // Stage 2: Partially lying - legs extending back
            const stage2Progress = (lieDownProgress - 0.33) / 0.33;
            // Left leg - extending back
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX + 5 + stage2Progress * 15, lieDownWaistY + 5 + stage2Progress * 0);
            ctx.stroke();
            // Right leg - extending back
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX + 6 + stage2Progress * 12, lieDownWaistY + 8 + stage2Progress * 0);
            ctx.stroke();
          } else {
            // Stage 3: Fully down - legs extended horizontally behind
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX + 20, lieDownWaistY + 5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX + 18, lieDownWaistY + 8);
            ctx.stroke();
          }
        } else {
          // Normal legs - only animate when moving
          const legOffset = this.isMoving ? Math.sin(this.frame * 2) * 8 : 0;
          
          // Front leg
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX + 12 + legOffset, waistY + 25);
          ctx.stroke();
          
          // Back leg
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX - 8 - legOffset, waistY + 25);
          ctx.stroke();
        }
        
        ctx.restore(); // Restore canvas state
        
        // Draw sound effect text above character's head (after restore so not affected by rotation)
        if (this.soundText) {
          // Calculate fade: persist for 1 second, then fade out
          let fadeAlpha = 1;
          if (this.soundTimer > this.soundDuration) {
            const fadeProgress = (this.soundTimer - this.soundDuration) / this.soundFadeDuration;
            fadeAlpha = 1 - fadeProgress; // Fade out after persistence
          }
          
          // Calculate text position relative to character (accounting for jump offset)
          const textX = this.x + (this.swayOffsetX || 0);
          const textY = (this.baseY + (this.swayOffsetY || 0) + this.jumpOffset) - 30;
          
          ctx.save();
          // Black typewriter font (monospace)
          ctx.font = 'bold 18px "Courier New", "Courier", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          // Draw black text (typewriter style)
          ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
          ctx.fillText(this.soundText, textX, textY);
          
          ctx.restore();
        }
        
        // Draw health bar
        this.drawHealthBar();
      }
      
      drawHealthBar() {
        // Draw health bar in top left corner (lowered by 20 pixels)
        const barWidth = 120;
        const barHeight = 20;
        const barX = 10;
        const barY = 30; // Lowered by 20 pixels (was 10)
        
        // Label (separated by 5 pixels from bar)
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('Fighter', barX, barY - 7); // Separated by 5 pixels (was -2, now -7)
        
        // Background (empty/red)
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        
        // Health bar color: Yellow until < 20%, then Red, Empty at 0
        const healthPercent = this.health / this.maxHealth;
        let healthColor;
        if (healthPercent > 0.2) {
          // Yellow (full health down to 20%)
          healthColor = '#FFFF00'; // Yellow
        } else if (healthPercent > 0) {
          // Red (20% down to 0%)
          healthColor = '#FF0000'; // Red
        } else {
          // Empty (0%)
          healthColor = '#000000'; // Black/Empty
        }
        
        ctx.fillStyle = healthColor;
        ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);
        
        // Border
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, barWidth, barHeight);
        
        // Health text below the bar
        ctx.fillStyle = '#000000';
        ctx.font = '12px Arial';
        ctx.fillText(`${Math.max(0, Math.floor(this.health))}/${this.maxHealth}`, barX, barY + barHeight + 15);
      }
      
      createYellowParticles() {
        // Create yellow pixels when hit by lightning
        const particleCount = 5 + Math.floor(Math.random() * 10);
        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.8;
          const speed = 2 + Math.random() * 3;
          this.yellowParticles.push({
            x: this.x + (Math.random() - 0.5) * 30,
            y: this.baseY + (Math.random() - 0.5) * 30,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 2,
            onGround: false,
            life: 60 + Math.random() * 40
          });
        }
      }
      
      updateYellowParticles() {
        const groundLevel = this.baseY + 55 + 25;
        for (let i = this.yellowParticles.length - 1; i >= 0; i--) {
          const p = this.yellowParticles[i];
          if (!p.onGround) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3; // Gravity
            p.vx *= 0.95;
            
            if (p.y >= groundLevel - p.size) {
              p.y = groundLevel - p.size;
              p.vy = 0;
              p.vx = 0;
              p.onGround = true;
            }
          }
          p.life--;

          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vy += 0.3; // Gravity
          particle.vx *= 0.98; // Slow down

          if (particle.y >= groundLevel - particle.size) {
