        this.hitDuration = 10; // Frames to show hit effect
        this.hitOffset = 0; // Offset when hit
        this.particles = []; // Array to store particle effects
        this.groundLevel = 0; // Ground level for particles
        this.fixedBaseY = fighter.baseY; // Store fixed Y position (stays steady)
        this.health = 100; // Health bar
        this.maxHealth = 100;
        this.isJumping = false; // Jump state
        this.isLyingDown = false; // Lie down state
        this.jumpTimer = 0;
        this.jumpDuration = 40;
        this.lieDownTimer = 0;
        this.lieDownDuration = 70;
        this.lava = []; // Lava projectiles
        this.lavaParticles = []; // Persistent lava particles on ground
        this.currentMove = 'ready'; // Current move state
        this.isDead = false; // Death state
        this.deathParticles = []; // Particles for death explosion
        this.deathTimer = 0; // Timer for death animation
        this.swordAttackCount = 0; // Count sword attacks for stun effect
        this.soundText = ''; // Sound effect text to display
        this.soundTimer = 0; // Timer for sound effect display
        this.soundDuration = 60; // 1 second at 60fps (persist for 1 second)
        this.soundFadeDuration = 30; // 0.5 seconds fade out
        this.frame = 0; // Animation frame counter
        this.isMoving = false; // Track if moving
        this.keys = {}; // Track pressed keys for continuous movement
        this.lightningBolts = []; // Lightning bolts from sword
        this.isDrowning = false; // Drowning state from trident attack
        this.drowningTimer = 0; // Timer for drowning animation
        this.drowningDuration = 240; // 4 seconds
        this.fireBreath = []; // Fire breath particles (blue and gold)
      }
      
      // Start drowning animation
      startDrowning() {
        if (this.isDrowning || this.isDead) return; // Already drowning or dead
        
        this.isDrowning = true;
        this.drowningTimer = 0;
        this.currentMove = 'drowning'; // Set move to drowning
        this.moveTimer = 0;
        this.moveDuration = this.drowningDuration;
        
        // Lose 50% health
        this.health = Math.max(0, this.health - this.maxHealth * 0.5);
      }
      
      update() {
        // Check for death
        if (this.health <= 0 && !this.isDead) {
          this.explode();
        }
        
        // If dead, only update death particles
        if (this.isDead) {
          this.updateDeathParticles();
          return;
        }
        
        // Update drowning state
        if (this.isDrowning) {
          this.drowningTimer++;
          this.moveTimer = this.drowningTimer;
          
          if (this.drowningTimer >= this.drowningDuration) {
            // End drowning
            this.isDrowning = false;
            this.drowningTimer = 0;
            this.currentMove = 'ready';
            this.moveTimer = 0;
          }
          // Don't process other updates while drowning
          this.updateLava();
          this.updateLavaParticles();
          this.updateLightningBolts();
          return;
        }
        
        this.frame++;
        
        // Update move timer
        if (this.currentMove !== 'ready') {
          this.moveTimer++;
          if (this.moveTimer >= this.moveDuration) {
            this.currentMove = 'ready';
            this.moveTimer = 0;
          }
        }
        
        // Trigger sound effect at the start of moves (same as fighter)
        if (this.moveTimer === 1 && this.currentMove !== 'ready') {
          this.triggerSoundEffect(this.currentMove);
        }
        
        // Update sound effect timer
        if (this.soundText) {
          this.soundTimer++;
          if (this.soundTimer > this.soundDuration + this.soundFadeDuration) {
            this.soundText = '';
            this.soundTimer = 0;
          }
        }
        
        // Update jump state
        if (this.currentMove === 'jump') {
          const moveFrame = this.moveTimer / this.moveDuration;
          this.jumpOffset = Math.sin(moveFrame * Math.PI) * -50;
        } else {
          this.jumpOffset = 0;
        }
        
        // Update rotation for tumble
        if (this.currentMove === 'tumble') {
          const moveFrame = this.moveTimer / this.moveDuration;
          this.rotation = moveFrame * Math.PI * 2;
        } else {
          this.rotation = 0;
        }
        
        // Update sway for ready stance
        if (this.currentMove === 'ready') {
          this.swayOffsetX = Math.sin(this.frame * 0.1) * 1.5;
          this.swayOffsetY = Math.sin(this.frame * 0.15) * 2;
          
          // Move based on keyboard input (arrow keys)
          this.isMoving = false;
          if (this.keys['ArrowLeft']) {
            this.x -= this.speed;
            this.isMoving = true;
            this.x = Math.max(0, this.x);
          }
          if (this.keys['ArrowRight']) {
            this.x += this.speed;
            this.isMoving = true;
            this.x = Math.min(canvas.width - 50, this.x);
          }
        } else {
          this.swayOffsetX = 0;
          this.swayOffsetY = 0;
        }
        
        // Check if fighter is punching and hitting
        const punchMoves = ['punch', 'uppercut'];
        const isPunching = punchMoves.includes(this.fighter.currentMove);
        const moveFrame = this.fighter.moveTimer / this.fighter.moveDuration;
        const punchIntensity = isPunching ? Math.sin(moveFrame * Math.PI) : 0;
        
        // Calculate punch reach (punch extends forward from fighter)
        const punchReach = isPunching ? 15 + punchIntensity * 25 : 0;
        const enemyRightEdge = this.x; // Enemy is left-facing, so right edge is at x
        const punchEnd = this.fighter.x + punchReach;
        
        // Check if punch connects (fighter punches right, enemy is to the right)
        const isHitNow = isPunching && punchIntensity > 0.4 && punchEnd >= enemyRightEdge - 15 && punchEnd <= enemyRightEdge + 30;
        
        // Create particles when hit (only if not already in hit state)
        if (isHitNow && this.hitTimer === 0) {
          this.hitTimer = this.hitDuration;
          this.hitOffset = -8; // Push back slightly when hit (negative for left-facing)
          this.health = Math.max(0, this.health - 5); // Reduce health
        }
        
        // Check if enemy is doing sword attack and hitting fighter
        const isSwordAttacking = this.currentMove === 'sword';
        const swordMoveFrame = this.moveTimer / this.moveDuration;
        const swordIntensity = isSwordAttacking ? Math.sin(swordMoveFrame * Math.PI) : 0;
        
        // Calculate sword reach (sword extends left from enemy, longer than punch)
        const swordReach = isSwordAttacking ? 20 + swordIntensity * 50 : 0; // Longer reach than punch
        const fighterLeftEdge = this.fighter.x; // Fighter is right-facing, so left edge is at x
        const swordEnd = this.x - swordReach; // Enemy sword swings left (negative direction)
        
        // Check if sword connects (enemy swings left, fighter is to the left)
        const swordHitNow = isSwordAttacking && swordIntensity > 0.4 && swordEnd <= fighterLeftEdge + 30 && swordEnd >= fighterLeftEdge - 15;
        
        // Create particles when hit (only if not already in hit state)
        if (swordHitNow && this.fighter.hitTimer === 0) {
          this.fighter.hitTimer = 10;
          this.fighter.health = Math.max(0, this.fighter.health - 5); // Same damage as punches
          
          // Increment sword attack counter on hit
          this.swordAttackCount++;
          
          // Every 10th sword attack that hits stuns the fighter
          if (this.swordAttackCount % 10 === 0) {
            this.fighter.stunnedTimer = this.fighter.stunDuration; // Stun for 3 seconds
          }
        }
        
        // Update hit effect
        if (this.hitTimer > 0) {
          this.hitTimer--;
          this.hitOffset = -(this.hitTimer / this.hitDuration) * 5; // Fade out
        } else {
          this.hitOffset = 0;
        }
        
        // Update lava
        this.updateLava();
        
        // Update persistent lava particles
        this.updateLavaParticles();
        
        // Update lightning bolts
        this.updateLightningBolts();
        
        // Update fire breath
        this.updateFireBreath(this.fighter);
      }
      
      shootLava() {
        // Start from enemy's head position
        const startX = this.x + (this.swayOffsetX || 0);
        const startY = this.baseY + (this.swayOffsetY || 0) + this.jumpOffset - 30; // Head level
        
        // Target fighter's head
        const targetX = this.fighter.x + (this.fighter.swayOffsetX || 0);
        const targetY = this.fighter.baseY + (this.fighter.swayOffsetY || 0) + this.fighter.jumpOffset - 30;
        const angle = Math.atan2(targetY - startY, targetX - startX);
        const speed = 6; // Same speed as vomit/knife
        
        // Create multiple pixel projectiles (identical physics to vomit)
        for (let i = 0; i < 5; i++) {
          const spread = (Math.random() - 0.5) * 0.3; // Small spread
          this.lava.push({
            x: startX,
            y: startY,
            vx: Math.cos(angle + spread) * speed,
            vy: Math.sin(angle + spread) * speed,
            angle: angle + spread, // Store angle like knife
            size: 3 + Math.random() * 2,
            life: 600, // Same lifetime as knife/vomit
            color: `hsl(${Math.random() * 30}, 100%, ${30 + Math.random() * 20}%)`, // Red-orange lava color
            fighter: this.fighter // Store fighter reference
          });
        }
      }
      
      updateLava() {
        const groundLevel = this.baseY + 55 + 25; // Same level as character's feet
        for (let i = this.lava.length - 1; i >= 0; i--) {
          const lava = this.lava[i];
          lava.x += lava.vx;
          lava.y += lava.vy;
          lava.vy += 0.2; // Gravity (identical to vomit/knife)
          lava.life--;
          
          // Check collision with fighter (identical to vomit collision detection)
          let hitFighter = false;
          if (lava.fighter && !lava.fighter.isDead) {
            const fighterHeadX = lava.fighter.x + (lava.fighter.swayOffsetX || 0);
            const fighterHeadY = lava.fighter.baseY + (lava.fighter.swayOffsetY || 0) + lava.fighter.jumpOffset - 30;
            const fighterBodyX = lava.fighter.x + (lava.fighter.swayOffsetX || 0);
            const fighterBodyY = lava.fighter.baseY + (lava.fighter.swayOffsetY || 0) + lava.fighter.jumpOffset;
            
            // Check collision with head (12px radius)
            const distanceToHead = Math.sqrt(Math.pow(lava.x - fighterHeadX, 2) + Math.pow(lava.y - fighterHeadY, 2));
            // Check collision with body (roughly 30px tall area)
            const distanceToBody = Math.sqrt(Math.pow(lava.x - fighterBodyX, 2) + Math.pow(lava.y - fighterBodyY, 2));
            
            if (distanceToHead < 20 || distanceToBody < 25) {
              lava.fighter.health = Math.max(0, lava.fighter.health - 1); // Same damage as vomit/knife
              hitFighter = true;
              // Create persistent particles on hit
              this.createLavaHitParticles(lava.x, lava.y);
              this.lava.splice(i, 1);
              continue;
            }
          }
          
          // Check if hit ground
          if (!hitFighter && lava.y >= groundLevel - lava.size) {
            // Create persistent particles on ground
            this.createLavaHitParticles(lava.x, groundLevel - lava.size);
            this.lava.splice(i, 1);
            continue;
          }
          
          // Remove if out of bounds or expired (identical to vomit/knife)
          if (lava.life <= 0 || lava.y > canvas.height || lava.x < 0 || lava.x > canvas.width) {
            // Create particles even if expired (landed somewhere)
            if (lava.y > canvas.height - 100) {
              this.createLavaHitParticles(lava.x, Math.min(lava.y, groundLevel));
            }
            this.lava.splice(i, 1);
          }
        }
      }
      
      createLavaHitParticles(x, y) {
        // Create persistent particles similar to death explosion
        const particleCount = 10 + Math.floor(Math.random() * 15);
        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.5;
          const speed = 0.5 + Math.random() * 1.5; // Slow motion speed like death particles
          this.lavaParticles.push({
            x: x + (Math.random() - 0.5) * 10,
            y: y + (Math.random() - 0.5) * 10,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 2 + Math.random() * 3,
            color: `hsl(${Math.random() * 30}, 100%, ${30 + Math.random() * 20}%)`, // Red-orange lava color
            life: 200 + Math.random() * 200, // Long life for persistence
            onGround: false
          });
        }
      }
      
      updateLavaParticles() {
        const groundLevel = this.baseY + 55 + 25; // Same level as character's feet
        for (let i = this.lavaParticles.length - 1; i >= 0; i--) {
          const p = this.lavaParticles[i];
          if (!p.onGround) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1; // Slow gravity for slow motion (like death particles)
            p.vx *= 0.98;
            
            if (p.y >= groundLevel - p.size) {
              p.y = groundLevel - p.size;
              p.vy = 0;
              p.vx = 0;
              p.onGround = true;
            }
          }
          p.life--;
          if (p.life <= 0) {
            this.lavaParticles.splice(i, 1);
          }
        }
      }
      
      drawLavaParticles() {
        ctx.imageSmoothingEnabled = false;
        for (const p of this.lavaParticles) {
          ctx.fillStyle = p.color;
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
        }
      }
      
      drawLava() {
        ctx.imageSmoothingEnabled = false;
        for (const lava of this.lava) {
          ctx.fillStyle = lava.color;
          ctx.fillRect(Math.floor(lava.x), Math.floor(lava.y), Math.ceil(lava.size), Math.ceil(lava.size));
          // Add glow effect
          ctx.shadowBlur = 5;
          ctx.shadowColor = lava.color;
          ctx.fillRect(Math.floor(lava.x), Math.floor(lava.y), Math.ceil(lava.size), Math.ceil(lava.size));
          ctx.shadowBlur = 0;
        }
      }
      
      createParticles() {
        // Calculate enemy center position (absolute position)
        const x = this.x + this.size / 2;
        const y = this.y + this.offsetY;
        
        // Create 1-10 particles
        const particleCount = 1 + Math.floor(Math.random() * 10);
        this.totalParticlesCreated += particleCount;
        
        // Remove 1 pixel for every 10 particles
        const pixelsToRemove = Math.floor(this.totalParticlesCreated / 10);
        const currentRemovedCount = this.removedPixels.length;
        
        // Add new removed pixels if needed
        if (pixelsToRemove > currentRemovedCount) {
          const pixelsWide = Math.floor(this.baseSize / this.pixelSize);
          const pixelsHigh = Math.floor(this.baseSize / this.pixelSize);
          const pixelsToAdd = pixelsToRemove - currentRemovedCount;
          
          // Add all missing pixels
          for (let i = 0; i < pixelsToAdd; i++) {
            let px, py;
            let attempts = 0;
            do {
              px = Math.floor(Math.random() * pixelsWide);
              py = Math.floor(Math.random() * pixelsHigh);
              attempts++;
            } while (this.removedPixels.some(p => p.px === px && p.py === py) && attempts < 500);
            
            // Only add if we found a unique pixel
            if (attempts < 500 && !this.removedPixels.some(p => p.px === px && p.py === py)) {
              this.removedPixels.push({ px, py });
            }
          }
        }
        
        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.8;
          const speed = 2 + Math.random() * 3;
          this.particles.push({
            x: x + (Math.random() - 0.5) * this.size * 0.8,
            y: y + (Math.random() - 0.5) * this.size * 0.8,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 4 + Math.random() * 2,
            onGround: false // Track if particle has landed
          });
        }
      }
      
      updateParticles() {
        // Particles are persistent - they fall and stay on ground
        for (const p of this.particles) {
          if (!p.onGround) {
            // Apply gravity and movement
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3; // Gravity
            
            // Slow down horizontal movement
            p.vx *= 0.95;
            
            // Check if particle hits ground
            if (p.y >= this.groundLevel - p.size) {
              p.y = this.groundLevel - p.size;
              p.vy = 0;
              p.vx = 0;
              p.onGround = true;
            }
          }
          // Once on ground, particles stay there permanently
        }
      }
      
      draw() {
        // If dead, only draw death particles
        if (this.isDead) {
          this.drawDeathParticles();
          return;
        }
        
        ctx.save(); // Save canvas state
        
        // Apply hit offset to position
        const actualX = this.x + (this.hitOffset || 0);
        
        // Apply rotation for tumble
        if (this.currentMove === 'tumble') {
          ctx.translate(actualX, this.baseY + 30); // Rotate around center of body
          ctx.rotate(this.rotation);
          ctx.translate(-actualX, -(this.baseY + 30)); // Translate back
        }
        
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        const waistX = actualX;
        const waistY = this.waistY + this.jumpOffset;
        let upperBodyX = actualX + (this.swayOffsetX || 0);
        let upperBodyY = this.baseY + (this.swayOffsetY || 0) + this.jumpOffset;
        
        // Adjust position for lieDown (3 stages: sitting -> partially lying -> fully down) - mirrored
        if (this.currentMove === 'lieDown') {
          const lieDownProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0; // 0 to 1, prevent division by zero
          const stage = lieDownProgress < 0.33 ? 1 : (lieDownProgress < 0.66 ? 2 : 3); // Stage 1, 2, or 3
          
          if (stage === 1) {
            // Stage 1: Sitting - body angled back, head higher (mirrored)
            upperBodyX = actualX - 10; // Mirror: negative offset
            upperBodyY = this.baseY + 55 + 15 - (lieDownProgress / 0.33) * 10; // Gradually lower
          } else if (stage === 2) {
            // Stage 2: Partially lying - body more horizontal (mirrored)
            const stage2Progress = (lieDownProgress - 0.33) / 0.33; // 0 to 1 within stage 2
            upperBodyX = actualX - 10 - stage2Progress * 5; // Mirror: move forward (negative)
            upperBodyY = this.baseY + 55 + 5 - stage2Progress * 5; // Lower to ground
          } else {
            // Stage 3: Fully down - body horizontal on ground (mirrored)
            upperBodyX = actualX - 15; // Mirror: negative offset for left-facing
            upperBodyY = this.baseY + 55 + 25 - 5; // On ground level
          }
        }
        
        // Head with blue face
        ctx.fillStyle = '#4169E1'; // Blue face
        ctx.beginPath();
        ctx.arc(upperBodyX, upperBodyY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Eye (mirrored - on left side since facing left)
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(upperBodyX - 3, upperBodyY, 2, 0, Math.PI * 2); // Mirror: negative X offset
        ctx.fill();
        
        // Body - 3 stages for lieDown, vertical otherwise (mirrored)
        let actualWaistX = waistX;
        let actualWaistY = waistY;
        if (this.currentMove === 'lieDown') {
          const lieDownProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0; // 0 to 1, prevent division by zero
          const stage = lieDownProgress < 0.33 ? 1 : (lieDownProgress < 0.66 ? 2 : 3);
          
          if (stage === 1) {
            // Stage 1: Sitting - body angled back (mirrored)
            const stage1Progress = lieDownProgress / 0.33; // 0 to 1 within stage 1
            const angle = Math.PI / 4 - stage1Progress * (Math.PI / 4); // 45 degrees to 0 degrees
            const bodyLength = 35;
            actualWaistX = upperBodyX - Math.cos(angle) * bodyLength; // Mirror: negative
            actualWaistY = upperBodyY + Math.sin(angle) * bodyLength;
            ctx.beginPath();
            ctx.moveTo(upperBodyX - 12, upperBodyY); // Mirror: negative offset
            ctx.lineTo(actualWaistX, actualWaistY);
            ctx.stroke();
          } else if (stage === 2) {
            // Stage 2: Partially lying - body transitioning to horizontal (mirrored)
            const stage2Progress = (lieDownProgress - 0.33) / 0.33; // 0 to 1 within stage 2
            actualWaistX = upperBodyX - 35 - stage2Progress * 10; // Mirror: gradually extend horizontally (negative)
            actualWaistY = upperBodyY + (1 - stage2Progress) * 5; // Gradually lower to same level
            ctx.beginPath();
            ctx.moveTo(upperBodyX - 12, upperBodyY); // Mirror: negative offset
            ctx.lineTo(actualWaistX, actualWaistY);
            ctx.stroke();
          } else {
            // Stage 3: Fully down - body horizontal (mirrored)
            actualWaistX = upperBodyX - 45; // Mirror: negative offset
            actualWaistY = upperBodyY;
            ctx.beginPath();
            ctx.moveTo(upperBodyX - 12, upperBodyY); // Mirror: negative offset
            ctx.lineTo(actualWaistX, actualWaistY);
            ctx.stroke();
          }
        } else {
          // Body vertical normally
          ctx.beginPath();
          ctx.moveTo(upperBodyX, upperBodyY + 12);
          ctx.lineTo(waistX, waistY);
          ctx.stroke();
        }
        
        // Draw karate move based on current move (mirrored)
        this.drawKarateMove(upperBodyX, upperBodyY, waistX, waistY);
        
        // Legs - different behavior for different moves (mirrored)
        if (this.currentMove === 'kick' || this.currentMove === 'spinKick') {
          const moveFrame = this.moveTimer / this.moveDuration;
          const kickIntensity = Math.sin(moveFrame * Math.PI);
          
          if (this.currentMove === 'spinKick') {
            // Spin kick - leg extends outward and rotates (mirrored)
            const spinAngle = moveFrame * Math.PI * 2;
            const kickLength = 30 + kickIntensity * 20;
            const kickX = waistX - Math.cos(spinAngle) * kickLength; // Mirror: negative
            const kickY = waistY + Math.sin(spinAngle) * kickLength;
            
            // Supporting leg
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(waistX + 8, waistY + 25); // Mirror: positive offset
            ctx.stroke();
            
            // Spinning leg
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(kickX, kickY);
            ctx.stroke();
          } else {
            // Regular kick (mirrored)
            // Back leg (supporting leg)
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(waistX + 8, waistY + 25); // Mirror: positive offset
            ctx.stroke();
            
            // Front leg kicks forward and up (mirrored)
            ctx.beginPath();
            ctx.moveTo(waistX, waistY);
            ctx.lineTo(waistX - 20 - kickIntensity * 25, waistY + 15 - kickIntensity * 20); // Mirror: negative
            ctx.stroke();
          }
        } else if (this.currentMove === 'jump') {
          // Jump - legs tucked up (mirrored)
          const moveFrame = this.moveTimer / this.moveDuration;
          const tuckAmount = Math.sin(moveFrame * Math.PI) * 15;
          
          // Front leg (mirrored)
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX - 8, waistY + 15 - tuckAmount); // Mirror: negative
          ctx.stroke();
          
          // Back leg (mirrored)
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX + 6, waistY + 15 - tuckAmount); // Mirror: positive
          ctx.stroke();
        } else if (this.currentMove === 'tumble') {
          // Tumble - legs extended during rotation (mirrored)
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX - 10, waistY + 20); // Mirror: negative
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX + 10, waistY + 20); // Mirror: positive
          ctx.stroke();
        } else if (this.currentMove === 'lieDown') {
          // Lie down - legs 3 stages (mirrored)
          const lieDownProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0; // Prevent division by zero
          const stage = lieDownProgress < 0.33 ? 1 : (lieDownProgress < 0.66 ? 2 : 3);
          
          // Use the waist position calculated in body drawing
          const lieDownWaistX = actualWaistX;
          const lieDownWaistY = actualWaistY;
          
          if (stage === 1) {
            // Stage 1: Sitting - legs bent in front (mirrored)
            const stage1Progress = lieDownProgress / 0.33;
            // Left leg - bent forward (mirrored)
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX - 15 + stage1Progress * 10, lieDownWaistY + 20 - stage1Progress * 15); // Mirror: negative/positive
            ctx.stroke();
            // Right leg - bent forward (mirrored)
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX - 18 + stage1Progress * 12, lieDownWaistY + 18 - stage1Progress * 12); // Mirror: negative/positive
            ctx.stroke();
          } else if (stage === 2) {
            // Stage 2: Partially lying - legs extending back (mirrored)
            const stage2Progress = (lieDownProgress - 0.33) / 0.33;
            // Left leg - extending back (mirrored)
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX - 5 - stage2Progress * 15, lieDownWaistY + 5 + stage2Progress * 0); // Mirror: negative
            ctx.stroke();
            // Right leg - extending back (mirrored)
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX - 6 - stage2Progress * 12, lieDownWaistY + 8 + stage2Progress * 0); // Mirror: negative
            ctx.stroke();
          } else {
            // Stage 3: Fully down - legs extended horizontally behind (mirrored)
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX - 20, lieDownWaistY + 5); // Mirror: negative
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(lieDownWaistX, lieDownWaistY);
            ctx.lineTo(lieDownWaistX - 18, lieDownWaistY + 8); // Mirror: negative
            ctx.stroke();
          }
        } else {
          // Normal legs - only animate when moving (mirrored)
          const legOffset = this.isMoving ? Math.sin(this.frame * 2) * 8 : 0;
          
          // Front leg (mirrored)
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX - 12 - legOffset, waistY + 25); // Mirror: negative
          ctx.stroke();
          
          // Back leg (mirrored)
          ctx.beginPath();
          ctx.moveTo(waistX, waistY);
          ctx.lineTo(waistX + 8 + legOffset, waistY + 25); // Mirror: positive
          ctx.stroke();
        }
        
        ctx.restore(); // Restore canvas state
        
        // Draw sound effect text above character's head (same as fighter)
        if (this.soundText) {
          // Calculate fade: persist for 1 second, then fade out
          let fadeAlpha = 1;
          if (this.soundTimer > this.soundDuration) {
            const fadeProgress = (this.soundTimer - this.soundDuration) / this.soundFadeDuration;
            fadeAlpha = 1 - fadeProgress; // Fade out after persistence
          }
          
          // Calculate text position relative to character (accounting for jump offset)
          const textX = this.x + (this.swayOffsetX || 0);
          const textY = (this.baseY + (this.swayOffsetY || 0) + this.jumpOffset) - 30;
          
          ctx.save();
          // Black typewriter font (monospace)
          ctx.font = 'bold 18px "Courier New", "Courier", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          // Draw black text (typewriter style)
          ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
          ctx.fillText(this.soundText, textX, textY);
          
          ctx.restore();
        }
        
        // Draw health bar for enemy
        this.drawHealthBar();
        
        // Draw lava projectiles
        this.drawLava();
      }
      
      drawParticles() {
        // Draw particles (called separately so they appear above everything)
        ctx.imageSmoothingEnabled = false;
        for (const p of this.particles) {
          // Bright neon green particles - persistent
          const greenValue = 255;
          const blueValue = 150;
          ctx.fillStyle = `rgb(0, ${greenValue}, ${blueValue})`;
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
          
          // Add bright outline for extra visibility
          ctx.strokeStyle = `rgb(0, 255, 200)`;
          ctx.lineWidth = 1;
          ctx.strokeRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
        }
      }
      
      shootLightning() {
        // Shoot 2 lightning bolts from the sword tip
        const actualX = this.x + (this.hitOffset || 0);
        const upperBodyX = actualX + (this.swayOffsetX || 0);
        const upperBodyY = this.baseY + (this.swayOffsetY || 0) + this.jumpOffset;
        
        // Calculate sword tip position (when sword is extended)
        const swordTipX = upperBodyX - 20 - 25 - 20; // Left-facing, extended sword
        const swordTipY = upperBodyY + 5;
        
        // Target fighter's head
        const targetX = this.fighter.x;
        const targetY = this.fighter.baseY - 30; // Head level
        
        // Create 2 lightning bolts with slight spread
        for (let i = 0; i < 2; i++) {
          const spread = (i - 0.5) * 30; // Spread them apart
          const endX = targetX + spread;
          const endY = targetY + (Math.random() - 0.5) * 20; // Slight vertical variation
          
          this.lightningBolts.push({
            startX: swordTipX,
            startY: swordTipY,
            endX: endX,
            endY: endY,
            progress: 0,
            speed: 0.15, // Progress per frame
            life: 60 // Frames until it disappears
          });
        }
      }
      
      updateLightningBolts() {
        for (let i = this.lightningBolts.length - 1; i >= 0; i--) {
          const bolt = this.lightningBolts[i];
          
          // Update progress
          bolt.progress += bolt.speed;
          bolt.life--;
          
          // Calculate current position
          const currentX = bolt.startX + (bolt.endX - bolt.startX) * bolt.progress;
          const currentY = bolt.startY + (bolt.endY - bolt.startY) * bolt.progress;
          
          // Check collision with fighter
          if (!this.fighter.isDead && bolt.progress > 0.3 && bolt.progress < 1.0) {
            const headX = this.fighter.x;
            const headY = this.fighter.baseY - 30;
            const distance = Math.sqrt(Math.pow(currentX - headX, 2) + Math.pow(currentY - headY, 2));
            
            if (distance < 25) {
              // Hit fighter
              this.fighter.health = Math.max(0, this.fighter.health - 10); // Lightning damage
              this.fighter.hitTimer = 10;
              this.fighter.createYellowParticles(headX, headY);
              this.lightningBolts.splice(i, 1);
              continue;
            }
          }
          
          // Remove if completed or expired
          if (bolt.progress >= 1.0 || bolt.life <= 0) {
            this.lightningBolts.splice(i, 1);
          }
        }
      }
      
      drawLightningBolts() {
        // Draw lightning bolts
        for (const bolt of this.lightningBolts) {
          const currentX = bolt.startX + (bolt.endX - bolt.startX) * bolt.progress;
          const currentY = bolt.startY + (bolt.endY - bolt.startY) * bolt.progress;
          
          // Draw jagged green lightning bolt with glow
          ctx.strokeStyle = '#00FF00'; // Green lightning
          ctx.lineWidth = 4;
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#00FF00';
          
          ctx.beginPath();
          ctx.moveTo(bolt.startX, bolt.startY);
          
          // Create jagged lightning path
          const segments = 12;
          let prevX = bolt.startX;
          let prevY = bolt.startY;
          
          for (let i = 1; i <= segments; i++) {
            const segProgress = i / segments;
            const baseX = bolt.startX + (currentX - bolt.startX) * segProgress;
            const baseY = bolt.startY + (currentY - bolt.startY) * segProgress;
            
            // Add jagged offset
            const offsetX = (Math.sin(segProgress * Math.PI * 4) * 8) + (Math.random() - 0.5) * 6;
            const offsetY = (Math.cos(segProgress * Math.PI * 3) * 6) + (Math.random() - 0.5) * 6;
            
            const segX = baseX + offsetX;
            const segY = baseY + offsetY;
            ctx.lineTo(segX, segY);
            prevX = segX;
            prevY = segY;
          }
          ctx.stroke();
        }
        
        ctx.shadowBlur = 0;
      }
      
      // Breathe fire (blue and gold)
      breathFire() {
        const actualX = this.x + (this.hitOffset || 0);
        const upperBodyX = actualX + (this.swayOffsetX || 0);
        const upperBodyY = this.baseY + (this.swayOffsetY || 0) + this.jumpOffset;
        
        // Fire comes from enemy's head/mouth area
        const fireStartX = upperBodyX - 10; // Left-facing enemy
        const fireStartY = upperBodyY - 5; // Head level
        
        // Target fighter
        const targetX = this.fighter.x;
        const targetY = this.fighter.baseY - 30; // Head level
        
        // Create blue and gold fire particles
        for (let i = 0; i < 5; i++) {
          const angle = Math.atan2(targetY - fireStartY, targetX - fireStartX) + (Math.random() - 0.5) * 0.4;
          const speed = 6 + Math.random() * 4;
          
          // Alternate between blue and gold, or random mix
          const isGold = Math.random() > 0.5;
          const color = isGold ? '#FFD700' : '#4169E1'; // Gold or blue
          
          this.fireBreath.push({
            x: fireStartX,
            y: fireStartY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 5 + Math.random() * 4,
            life: 80,
            color: color,
            alpha: 0.8 + Math.random() * 0.2
          });
        }
      }
      
      // Update fire breath particles
      updateFireBreath(fighter) {
        for (let i = this.fireBreath.length - 1; i >= 0; i--) {
          const fire = this.fireBreath[i];
          
          fire.x += fire.vx;
          fire.y += fire.vy;
          fire.vy += 0.2; // Slight gravity
          fire.vx *= 0.97; // Slow down
          fire.life--;
          
          // Evaporate water particles on collision
          if (fighter.waterParticles && fighter.waterParticles.length > 0) {
            for (let j = fighter.waterParticles.length - 1; j >= 0; j--) {
              const water = fighter.waterParticles[j];
              const distance = Math.sqrt(Math.pow(fire.x - water.x, 2) + Math.pow(fire.y - water.y, 2));
              if (distance < fire.size + water.size) {
                // Evaporate water particle
                fighter.waterParticles.splice(j, 1);
              }
            }
          }
          
          // Check collision with fighter
          if (!fighter.isDead) {
            const headX = fighter.x;
            const headY = fighter.baseY - 30;
            const distance = Math.sqrt(Math.pow(fire.x - headX, 2) + Math.pow(fire.y - headY, 2));
            
            if (distance < 25) {
              // Hit fighter - deal 50% damage (same as trident)
              fighter.health = Math.max(0, fighter.health - fighter.maxHealth * 0.5);
              fighter.hitTimer = 10;
              fighter.createYellowParticles(headX, headY);
              this.fireBreath.splice(i, 1);
              continue;
            }
          }
          
          // Remove if expired
          if (fire.life <= 0 || fire.y > canvas.height || fire.x < 0 || fire.x > canvas.width) {
            this.fireBreath.splice(i, 1);
          }
        }
      }
      
      // Draw fire breath particles
      drawFireBreath() {
        ctx.save();
        for (const fire of this.fireBreath) {
          ctx.globalAlpha = fire.alpha;
          ctx.fillStyle = fire.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = fire.color;
          ctx.beginPath();
          ctx.arc(fire.x, fire.y, fire.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        ctx.shadowBlur = 0;
      }
      
      drawHealthBar() {
        // Draw health bar in top right corner (lowered by 20 pixels)
        const barWidth = 120;
        const barHeight = 20;
        const barX = canvas.width - barWidth - 10;
        const barY = 30; // Lowered by 20 pixels (was 10)
        
        // Label (separated by 5 pixels from bar)
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'right';
        ctx.fillText('Enemy', barX + barWidth, barY - 7); // Separated by 5 pixels (was -2, now -7)
        
        // Background (empty/red)
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        
        // Health bar color: Blue until < 20%, then Red, Empty at 0
        const healthPercent = this.health / this.maxHealth;
        let healthColor;
        if (healthPercent > 0.2) {
          // Blue (full health down to 20%)
          healthColor = '#0000FF'; // Blue
        } else if (healthPercent > 0) {
          // Red (20% down to 0%)
          healthColor = '#FF0000'; // Red
        } else {
          // Empty (0%)
          healthColor = '#000000'; // Black/Empty
        }
        
        ctx.fillStyle = healthColor;
        ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);
        
        // Border
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, barWidth, barHeight);
        
        // Health text below the bar
        ctx.fillStyle = '#000000';
        ctx.font = '12px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(`${Math.max(0, Math.floor(this.health))}/${this.maxHealth}`, barX + barWidth, barY + barHeight + 15);
      }
      
      drawKarateMove(upperBodyX, upperBodyY, waistX, waistY) {
        const moveFrame = this.moveTimer / this.moveDuration; // 0 to 1
        const intensity = Math.sin(moveFrame * Math.PI); // Smooth animation curve
        
        switch(this.currentMove) {
          case 'punch':
            // Right arm punches forward (mirrored - left-facing)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 15 - intensity * 25, upperBodyY + 10 + intensity * 5); // Mirror: negative
            ctx.stroke();
            // Left arm guards (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 10, upperBodyY + 15); // Mirror: negative
            ctx.stroke();
            break;
            
          case 'kick':
            // Arms up for balance (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 15, upperBodyY + 5); // Mirror: negative
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 20, upperBodyY + 8); // Mirror: negative
            ctx.stroke();
            break;
            
          case 'spinKick':
            // Arms spread for balance during spin (mirrored)
            const spinFrame = this.moveTimer / this.moveDuration;
            const spinAngle = spinFrame * Math.PI * 2;
            const armLength = 20;
            const leftArmX = upperBodyX - Math.cos(spinAngle + Math.PI / 2) * armLength; // Mirror: negative
            const leftArmY = upperBodyY + 15 + Math.sin(spinAngle + Math.PI / 2) * armLength;
            const rightArmX = upperBodyX - Math.cos(spinAngle - Math.PI / 2) * armLength; // Mirror: negative
            const rightArmY = upperBodyY + 20 + Math.sin(spinAngle - Math.PI / 2) * armLength;
            
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(leftArmX, leftArmY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(rightArmX, rightArmY);
            ctx.stroke();
            break;
            
          case 'jump':
            // Arms up during jump (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 18, upperBodyY - 5); // Mirror: negative
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 22, upperBodyY - 3); // Mirror: negative
            ctx.stroke();
            break;
            
          case 'tumble':
            // Arms extended during tumble (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 25, upperBodyY + 10); // Mirror: negative
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX + 20, upperBodyY + 15); // Mirror: positive
            ctx.stroke();
            break;
            
          case 'lieDown':
            // Arms attached to body - 3 stages (mirrored)
            const lieDownProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0; // 0 to 1, prevent division by zero
            const stage = lieDownProgress < 0.33 ? 1 : (lieDownProgress < 0.66 ? 2 : 3);
            
            if (stage === 1) {
              // Stage 1: Sitting - arms supporting body (behind/at sides) (mirrored)
              const stage1Progress = lieDownProgress / 0.33;
              // Left arm - supporting behind (mirrored)
              ctx.beginPath();
              ctx.moveTo(upperBodyX - 12, upperBodyY + 15); // Mirror: negative offset
              ctx.lineTo(upperBodyX - 8 + stage1Progress * 5, upperBodyY + 20 + stage1Progress * 3); // Mirror: positive
              ctx.stroke();
              // Right arm - supporting behind (mirrored)
              ctx.beginPath();
              ctx.moveTo(upperBodyX - 12, upperBodyY + 18); // Mirror: negative offset
              ctx.lineTo(upperBodyX - 6 + stage1Progress * 5, upperBodyY + 22 + stage1Progress * 3); // Mirror: positive
              ctx.stroke();
            } else if (stage === 2) {
              // Stage 2: Partially lying - arms transitioning to sides (mirrored)
              const stage2Progress = (lieDownProgress - 0.33) / 0.33;
              // Left arm - transitioning (mirrored)
              ctx.beginPath();
              ctx.moveTo(upperBodyX - 12, upperBodyY + 15); // Mirror: negative offset
              ctx.lineTo(upperBodyX - 3 + stage2Progress * 8, upperBodyY + 23 + (1 - stage2Progress) * 2); // Mirror: positive
              ctx.stroke();
              // Right arm - transitioning (mirrored)
              ctx.beginPath();
              ctx.moveTo(upperBodyX - 12, upperBodyY + 18); // Mirror: negative offset
              ctx.lineTo(upperBodyX - 1 + stage2Progress * 8, upperBodyY + 25 + (1 - stage2Progress) * 3); // Mirror: positive
              ctx.stroke();
            } else {
              // Stage 3: Fully down - arms at sides (mirrored)
              ctx.beginPath();
              ctx.moveTo(upperBodyX - 12, upperBodyY + 15); // Mirror: negative offset
              ctx.lineTo(upperBodyX + 5, upperBodyY + 25); // Mirror: positive
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(upperBodyX - 12, upperBodyY + 18); // Mirror: negative offset
              ctx.lineTo(upperBodyX + 2, upperBodyY + 28); // Mirror: positive
              ctx.stroke();
            }
            break;
            
          case 'block':
            // Both arms up blocking (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 20 - intensity * 5, upperBodyY - 5); // Mirror: negative
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 15 - intensity * 5, upperBodyY + 5); // Mirror: negative
            ctx.stroke();
            break;
            
          case 'uppercut':
            // Right arm uppercut (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 10 - intensity * 20, upperBodyY - 10 - intensity * 15); // Mirror: negative
            ctx.stroke();
            // Left arm guards (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 12, upperBodyY + 8); // Mirror: negative
            ctx.stroke();
            break;
            
          case 'sword':
            // Sword attack - arm swings sword forward (left, since enemy faces left)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            // Arm holding sword
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 22);
            ctx.lineTo(upperBodyX - 20 - intensity * 30, upperBodyY + 5 - intensity * 10);
            ctx.stroke();
            // Sword blade (longer reach than punch)
            const swordTipX = upperBodyX - 20 - intensity * 30 - 25 - intensity * 20;
            const swordTipY = upperBodyY + 5 - intensity * 10;
            ctx.beginPath();
            ctx.moveTo(upperBodyX - 20 - intensity * 30, upperBodyY + 5 - intensity * 10);
            ctx.lineTo(swordTipX, swordTipY);
            ctx.stroke();
            // Sword handle
            ctx.beginPath();
            ctx.moveTo(upperBodyX - 20 - intensity * 30, upperBodyY + 5 - intensity * 10);
            ctx.lineTo(upperBodyX - 15 - intensity * 25, upperBodyY + 8 - intensity * 8);
            ctx.stroke();
            // Other arm guards
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 12, upperBodyY + 10);
            ctx.stroke();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            break;
            
          case 'drowning':
            // Drowning animation - hands over head, frozen
            const drowningProgress = this.moveDuration > 0 ? this.moveTimer / this.moveDuration : 0;
            const bobAmount = Math.sin(drowningProgress * Math.PI * 4) * 3; // Slight bobbing motion
            
            // Both arms up over head (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 15, upperBodyY - 15 + bobAmount); // Mirror: negative, up over head
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 12, upperBodyY - 12 + bobAmount); // Mirror: negative, up over head
            ctx.stroke();
            break;
            
          case 'ready':
          default:
            // Ready stance - arms in guard position (mirrored)
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 20);
            ctx.lineTo(upperBodyX - 12, upperBodyY + 8); // Mirror: negative
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upperBodyX, upperBodyY + 25);
            ctx.lineTo(upperBodyX - 10, upperBodyY + 12); // Mirror: negative
            ctx.stroke();
            break;
        }
      }
      
      triggerRandomAction() {
        if (this.currentMove !== 'ready') return; // Don't interrupt current move
        
        // Only sword attacks for enemy
        this.currentMove = 'sword';
        this.moveTimer = 0;
        this.moveDuration = 40 + Math.random() * 40;
        
        // Trigger sound effects for sword attack
        this.triggerSoundEffect(this.currentMove);
      }
      
      // Trigger sound effect for moves (same as fighter)
      triggerSoundEffect(move) {
        // Only trigger on actions, not on 'ready' stance
        if (move === 'ready') {
          return;
        }
        
        // Only trigger sound effects 1 out of 5 times (20% chance)
        if (Math.random() > 0.2) {
          return;
        }
        
        // Expanded sound effects - same as fighter
        const allSoundEffects = [
          'Hiyahhh!', 'Hya!', 'Hiya!', 'Hah!', 'Hup!', 'Hyaa!', 'Upp!', 'Whoa!',
          'Hiyah!', 'Whaa!', 'Yah!', 'Hoo!', 'Hahh!', 'Hyah!', 'Wah!', 'Hooah!',
          'Yahh!', 'Hiyahh!', 'Hyaah!', 'Whaah!', 'Hooahh!', 'Yahhh!', 'Hiyahhhh!', 'Hyaaa!'
        ];
        
        // Pick a random sound effect
        this.soundText = allSoundEffects[Math.floor(Math.random() * allSoundEffects.length)];
        this.soundTimer = 0;
      }
      
      explode() {
        // Create death explosion particles in slow motion
        if (this.isDead) return; // Already exploded
        this.isDead = true;
        this.deathTimer = 0;
        
        // Create many particles for explosion
        const particleCount = 100;
        const centerX = this.x;
        const centerY = this.baseY;
        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.5;
          const speed = 0.5 + Math.random() * 1.5; // Slow motion speed
          this.deathParticles.push({
            x: centerX + (Math.random() - 0.5) * 30,
            y: centerY + (Math.random() - 0.5) * 30,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 2 + Math.random() * 3,
            color: `hsl(${Math.random() * 60}, 100%, ${40 + Math.random() * 30}%)`, // Red/orange/yellow colors
            life: 300 + Math.random() * 200, // Long life for slow motion
            onGround: false
          });
        }
      }
      
      updateDeathParticles() {
        const groundLevel = this.baseY + 55 + 25; // Same as fighter - waist + leg length
        for (let i = this.deathParticles.length - 1; i >= 0; i--) {
          const p = this.deathParticles[i];
          if (!p.onGround) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1; // Slow gravity for slow motion
            p.vx *= 0.98;
            
            if (p.y >= groundLevel - p.size) {
              p.y = groundLevel - p.size;
              p.vy = 0;
              p.vx = 0;
              p.onGround = true;
            }
          }
          p.life--;
          if (p.life <= 0) {
            this.deathParticles.splice(i, 1);
          }
        }
        this.deathTimer++;
      }
      
      drawDeathParticles() {
        ctx.imageSmoothingEnabled = false;
        for (const p of this.deathParticles) {
          ctx.fillStyle = p.color;
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
        }
      }
      
      shootCannonball() {
        const startX = this.x + this.size / 2;
        const startY = this.fixedBaseY + this.offsetY;
        const targetX = this.fighter.x;
        const targetY = this.fighter.baseY - 30; // Aim at head (head is about 30 pixels above baseY)
        const angle = Math.atan2(targetY - startY, targetX - startX);
        const speed = 6; // Increased speed for farther travel
        this.cannonballs.push({
          x: startX,
          y: startY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 600 // Increased lifetime for farther travel
        });
      }
      
      updateCannonballs() {
        for (let i = this.cannonballs.length - 1; i >= 0; i--) {
          const ball = this.cannonballs[i];
          ball.x += ball.vx;
          ball.y += ball.vy;
          ball.vy += 0.2; // Gravity
          ball.life--;
          
          // Check collision with fighter's head
          const headY = this.fighter.baseY - 30;
          const distance = Math.sqrt(Math.pow(ball.x - this.fighter.x, 2) + Math.pow(ball.y - headY, 2));
          if (distance < 25 && !this.fighter.isDead) {
            this.fighter.health = Math.max(0, this.fighter.health - 1); // 1/10 of lightning damage (10 -> 1)
            this.cannonballs.splice(i, 1);
            continue;
          }
          
          if (ball.life <= 0 || ball.y > canvas.height) {
            this.cannonballs.splice(i, 1);
          }
        }
      }
      
      drawCannonballs() {
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const ball of this.cannonballs) {
          ctx.fillText('0', ball.x, ball.y);
        }
      }
    }
    
    // Create the stick figure - starting from left side
    // Position fighter at ground level (canvas.height - 50 for ground line, minus character height)
    const fighter = new StickFigure(canvas.width / 2, canvas.height - 100);
    
    // Create the enemy
    const enemy = new Enemy(fighter);
    // Initialize enemy position (start to the right of fighter)
    enemy.x = fighter.x + 50;
    
    // Game state
    let gameState = 'playing'; // 'playing', 'death', 'gameOver'
    let deathTimer = 0;
    let gameOverTimer = 0;
    const deathDisplayDuration = 300; // 5 seconds at 60fps
    const gameOverDisplayDuration = 300; // 5 seconds at 60fps
    
    // Static cityscape data (generated once, drawn every frame)
    let cityscapeBuildings = [];
    let cityscapeClouds = [];
    
    // Function to generate static cityscape
    function generateCityscape() {
      const groundY = canvas.height - 50;
      const buildingCount = 25; // Increased from 8 to 25 for more buildings
      cityscapeBuildings = [];
      
      for (let i = 0; i < buildingCount; i++) {
        const x = (canvas.width / buildingCount) * i + (Math.random() - 0.5) * (canvas.width / buildingCount);
        const width = 20 + Math.random() * 50;
        const height = 40 + Math.random() * 180;
        const y = groundY - height;
        const alpha = 0.3 + Math.random() * 0.4; // Random alpha between 0.3 and 0.7
        
        // Generate windows for this building (static)
        const windows = [];
        for (let wy = y + 10; wy < groundY - 5; wy += 15) {
          for (let wx = x + 5; wx < x + width - 5; wx += 10) {
            if (Math.random() > 0.5) {
              windows.push({ x: wx, y: wy, width: 3, height: 5 });
            }
          }
        }
        
        cityscapeBuildings.push({
          x: x,
          y: y,
          width: width,
          height: height,
          windows: windows,
          alpha: alpha
        });
      }
      
      // Generate clouds
      cityscapeClouds = [];
      const cloudCount = 8;
      for (let i = 0; i < cloudCount; i++) {
        cityscapeClouds.push({
          x: Math.random() * canvas.width,
          y: 30 + Math.random() * 150, // Clouds in upper portion of sky
          size: 30 + Math.random() * 40,
          alpha: 0.4 + Math.random() * 0.3 // Slight variation in cloud opacity
        });
      }
    }
    
    // Generate initial cityscape
    generateCityscape();
    
    // Replay button
    const replayButton = {
      x: canvas.width / 2 - 90,
      y: canvas.height / 2 + 100,
      width: 180,
      height: 40,
      visible: false
    };
    
    // Keyboard event listeners - use window instead of document for better compatibility
    window.addEventListener('keydown', (e) => {
      // Prevent input when not playing
      if (gameState !== 'playing') {
        return;
      }
      
      // Set fighter keys for movement (only WASD keys, not arrow keys)
      const keyLower = e.key.toLowerCase();
      const fighterMovementKeys = ['a', 'd']; // Only movement keys go in fighter.keys
      if (!fighter.isDead && fighterMovementKeys.includes(keyLower)) {
        fighter.keys[keyLower] = true;
        fighter.keys[e.key] = true; // Also store original case
      }
      
      // Set enemy keys for movement (only arrow keys)
      if (!enemy.isDead && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        enemy.keys[e.key] = true;
      }
      
      // Fighter controls (only if not dead and not stunned)
      if (!fighter.isDead && fighter.stunnedTimer === 0) {
        // W key triggers jump for fighter
        if (e.key === 'w' || e.key === 'W') {
          e.preventDefault();
          if (fighter.currentMove === 'ready') {
            fighter.currentMove = 'jump';
            fighter.moveTimer = 0;
            fighter.moveDuration = 40 + Math.random() * 40;
            fighter.jumpOffset = 0;
            fighter.triggerSoundEffect('jump');
          }
          return;
        }
        
        // S key triggers lie down for fighter
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          if (fighter.currentMove === 'ready') {
            fighter.currentMove = 'lieDown';
            fighter.moveTimer = 0;
            fighter.moveDuration = 70 + Math.random() * 40;
            fighter.triggerSoundEffect('lieDown');
          }
          return;
        }
        
        // X key triggers random action for fighter
        if (e.key === 'x' || e.key === 'X') {
          e.preventDefault();
          fighter.triggerRandomAction();
          return;
        }
        
        // Z key triggers radioactive vomit for fighter
        if (e.key === 'z' || e.key === 'Z') {
          e.preventDefault();
          fighter.shootRadioactiveVomit(enemy);
          return;
        }
        
        // Q key triggers trident water attack for fighter
        if (e.key === 'q' || e.key === 'Q') {
          e.preventDefault();
          fighter.triggerTridentAttack(enemy);
          return;
        }
      }
      
      // Enemy controls: Arrow keys and spacebar (independent of fighter state)
      if (!enemy.isDead) {
        // Up arrow triggers jump for enemy
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (enemy.currentMove === 'ready') {
            enemy.currentMove = 'jump';
            enemy.moveTimer = 0;
            enemy.moveDuration = 40 + Math.random() * 40;
            enemy.jumpOffset = 0;
          }
          return;
        }
        
        // Down arrow triggers lie down for enemy
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (enemy.currentMove === 'ready') {
            enemy.currentMove = 'lieDown';
            enemy.moveTimer = 0;
            enemy.moveDuration = 70 + Math.random() * 40;
          }
          return;
        }
        
        // Left arrow - track key for continuous movement
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          enemy.keys['ArrowLeft'] = true;
          return;
        }
        
        // Right arrow - track key for continuous movement
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          enemy.keys['ArrowRight'] = true;
          return;
        }
        
        // Spacebar triggers random action for enemy
        if (e.key === ' ') {
          e.preventDefault();
          enemy.triggerRandomAction();
          return;
        }
        
        // "/" key triggers lava attack for enemy
        if (e.key === '/' || e.key === '?') {
          e.preventDefault();
          enemy.shootLava();
          return;
        }
        
        // "o" key triggers lightning bolt attack for enemy
        if (e.key === 'o' || e.key === 'O') {
          e.preventDefault();
          enemy.shootLightning();
          return;
        }
        
        // "j" key triggers fire breath attack for enemy
        if (e.key === 'j' || e.key === 'J') {
          e.preventDefault();
          enemy.breathFire();
          return;
        }
      }
    });
    
    document.addEventListener('keyup', (e) => {
      const keyLower = e.key.toLowerCase();
      
      // Clear fighter movement keys (only a and d)
      if (keyLower === 'a' || keyLower === 'd') {
        if (fighter.keys.hasOwnProperty(keyLower)) {
          fighter.keys[keyLower] = false;
        }
        if (fighter.keys.hasOwnProperty(e.key)) {
          fighter.keys[e.key] = false;
        }
      }
      
      // Reset Z key flag so it can be pressed again
      if (e.key === 'z' || e.key === 'Z') {
        fighter.zKeyPressed = false;
      }
      
      // Clear enemy arrow keys for continuous movement
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        enemy.keys[e.key] = false;
      }
    });
    
    // Focus canvas on load so keyboard events work
    canvas.focus();
    
    // Function to reset game (called by replay button or keyboard)
    function resetGame() {
      // Regenerate cityscape for variety
      generateCityscape();
      
      fighter.health = 100;
      fighter.isDead = false;
      fighter.deathParticles = [];
      fighter.deathTimer = 0;
      fighter.x = canvas.width / 2;
      fighter.yellowParticles = [];
      fighter.knives = [];
      fighter.radioactiveVomit = [];
      fighter.waterParticles = []; // Clear water particles
      fighter.vomitParticles = [];
      fighter.stunnedTimer = 0;
      enemy.health = 100;
      enemy.isDead = false;
      enemy.deathParticles = [];
      enemy.deathTimer = 0;
      enemy.x = fighter.x + 50;
      enemy.particles = [];
      enemy.lava = [];
      enemy.lavaParticles = [];
      enemy.lightningBolts = [];
      enemy.fireBreath = []; // Clear fire breath particles
      enemy.isDrowning = false;
      enemy.drowningTimer = 0;
      enemy.currentMove = 'ready';
      enemy.moveTimer = 0;
      enemy.frame = 0;
      gameState = 'playing';
      deathTimer = 0;
      gameOverTimer = 0;
      replayButton.visible = false;
    }
    
    // Add keyboard control for replay (R key)
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'r' || e.key === 'R') && replayButton.visible) {
        e.preventDefault();
        resetGame();
      }
    });
    
    // Add mouse click control for replay button
    canvas.addEventListener('click', (e) => {
      if (!replayButton.visible) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Check if click is within replay button bounds
      if (x >= replayButton.x && x <= replayButton.x + replayButton.width &&
          y >= replayButton.y && y <= replayButton.y + replayButton.height) {
        resetGame();
      }
    });
    
    // Animation loop
    function animate() {
      // Clear the canvas with white background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const groundY = canvas.height - 50;
      
      // Draw sky (very light blue - 50% lighter)
      ctx.fillStyle = '#C3E6F5'; // Very light sky blue (50% lighter than #87CEEB)
      ctx.fillRect(0, 0, canvas.width, groundY);
      
      // Draw clouds (white, semi-transparent)
      ctx.fillStyle = '#FFFFFF';
      for (const cloud of cityscapeClouds) {
        ctx.globalAlpha = cloud.alpha;
        // Draw cloud as overlapping circles for fluffy effect
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.size * 0.6, cloud.y, cloud.size * 0.8, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.size * 0.6, cloud.y, cloud.size * 0.8, 0, Math.PI * 2);
        ctx.arc(cloud.x, cloud.y - cloud.size * 0.5, cloud.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0; // Reset alpha
      
      // Draw static city silhouettes with alpha transparency
      ctx.strokeStyle = '#E8E8E8';
      ctx.lineWidth = 1;
      
      // Draw static buildings (same every frame) with alpha
      for (const building of cityscapeBuildings) {
        ctx.globalAlpha = building.alpha;
        ctx.fillStyle = '#E8E8E8'; // Grey buildings
        
        // Building rectangle
        ctx.fillRect(building.x, building.y, building.width, building.height);
        
        // Draw windows (very faint, with slightly higher alpha)
        ctx.globalAlpha = Math.min(1.0, building.alpha + 0.2);
        ctx.fillStyle = '#F0F0F0';
        for (const window of building.windows) {
          ctx.fillRect(window.x, window.y, window.width, window.height);
        }
      }
      ctx.globalAlpha = 1.0; // Reset alpha
      
      // Draw ground line (very light)
      ctx.strokeStyle = '#E0E0E0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();
      
      // Check for death and update game state
      if (gameState === 'playing') {
        if (fighter.isDead || enemy.isDead) {
          gameState = 'death';
          deathTimer = 0;
        }
      } else if (gameState === 'death') {
        deathTimer++;
        if (deathTimer >= deathDisplayDuration) {
          gameState = 'gameOver';
          gameOverTimer = 0;
        }
      } else if (gameState === 'gameOver') {
        gameOverTimer++;
        if (gameOverTimer >= gameOverDisplayDuration) {
          replayButton.visible = true;
        }
      }
      
      // Update and draw enemy first (so fighter appears in front)
      if (gameState === 'playing' || enemy.isDead || fighter.isDead) {
        enemy.update();
      }
      enemy.draw();
      if (!enemy.isDead && gameState === 'playing') {
        enemy.drawHealthBar();
      }
      
      // Update and draw fighter (moving and doing karate moves)
      if (gameState === 'playing' || fighter.isDead || enemy.isDead) {
        fighter.update(enemy);
      }
      fighter.draw();
      if (!fighter.isDead && gameState === 'playing') {
        // Draw health bar only if not dead
        fighter.drawHealthBar();
      }
      
      // Draw yellow particles from fighter
      fighter.drawYellowParticles();
      
      // Draw stun indicator if fighter is stunned
      if (fighter.stunnedTimer > 0 && !fighter.isDead) {
        ctx.fillStyle = '#FF0000';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('STUNNED!', fighter.x, fighter.baseY - 80);
      }
      
      // Draw knives
      fighter.drawKnives();
      
      // Draw radioactive vomit from fighter
      fighter.drawRadioactiveVomit();
      
      // Draw persistent vomit particles
      fighter.drawVomitParticles();
      
      // Draw water particles from trident attack
      fighter.drawWaterParticles();
      
      // Draw lava from enemy
      enemy.drawLava();
      
      // Draw persistent lava particles
      enemy.drawLavaParticles();
      
      // Draw lightning bolts from enemy
      enemy.drawLightningBolts();
      
      // Draw fire breath from enemy
      enemy.drawFireBreath();
      
      // Draw death text
      if (gameState === 'death') {
        ctx.fillStyle = '#FF0000';
        ctx.font = 'bold 80px Arial';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText('DEATH!', canvas.width / 2, canvas.height / 2 - 50);
        ctx.fillText('DEATH!', canvas.width / 2, canvas.height / 2 - 50);
      }
      
      // Draw game over text
      if (gameState === 'gameOver') {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 60px Arial';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);
      }
      
      // Draw replay button
      if (replayButton.visible) {
        // Button background
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(replayButton.x, replayButton.y, replayButton.width, replayButton.height);
        
        // Button border
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(replayButton.x, replayButton.y, replayButton.width, replayButton.height);
        
        // Button text (same font as health bar labels)
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('REPLAY (Press R)', replayButton.x + replayButton.width / 2, replayButton.y + replayButton.height / 2 + 5);
      }
      
      // Update control instructions in HTML (only when playing)
      if (gameState === 'playing') {
        const controlsDiv = document.getElementById('controls');
        if (controlsDiv) {
          controlsDiv.innerHTML = '<p>Fighter Controls: A = Left, S = Lie Down, D = Right, W = Jump, X = Random Attack, Z = Radioactive Vomit, Q = Trident Water Attack</p><p>Enemy Controls: Arrow Left/Right = Move, Arrow Up = Jump, Arrow Down = Lie Down, Space = Random Attack, / = Lava Attack, O = Lightning Bolts, J = Fire Breath</p>';
        }
      } else {
        const controlsDiv = document.getElementById('controls');
        if (controlsDiv) {
          controlsDiv.innerHTML = '';
        }
      }
      
      // Continue animation
      requestAnimationFrame(animate);
    }
    
    // Focus canvas on load so keyboard events work
    canvas.focus();
    
    // Set date and version number
    const versionInfo = document.getElementById('version-info');
    const today = new Date();
    const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    versionInfo.textContent = `${dateString} - v0.01`;
    
    // Start the animation
    animate();
  </script>
</body>
</html>
