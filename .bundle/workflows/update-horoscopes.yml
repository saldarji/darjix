name: Update Horoscopes

on:
  schedule:
    # Mondays 9am UTC (same slot as EdTech news)
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-horoscopes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run horoscope agent
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/horoscope_agent.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/horoscopes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Horoscopes - $(date +'%B %d, %Y')" && git pull --rebase origin main && git push origin HEAD:main)

      - name: Trigger Pages rebuild
        if: success()
        run: |
          sleep 5
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}')
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" != "204" ]; then
            echo "⚠️  API trigger returned HTTP $http_code. Pages workflow should still trigger automatically on push."
          else
            echo "✅ Successfully triggered Pages workflow via API"
          fi
