---
layout: default
title: Admin - DARJIX
---

<!-- Password Protection Overlay -->
<div id="password-overlay" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
  <div class="max-w-md w-full mx-4">
    <div class="border-2 border-black p-8">
      <h2 class="text-2xl font-bold text-black mb-4">Admin Access</h2>
      <p class="text-sm text-gray-600 mb-6">Enter password to access the admin panel</p>
      <div>
        <div class="relative mb-4">
          <input 
            type="password" 
            id="admin-password" 
            placeholder="Password"
            class="w-full px-4 py-2 pr-12 border border-gray-300 focus:border-black focus:outline-none"
            autocomplete="off"
          >
          <button
            type="button"
            id="toggle-password"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 hover:text-black transition cursor-pointer flex items-center justify-center"
            title="Show/Hide password"
            style="height: 24px; width: 24px;"
          >
            <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <svg id="eye-off-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
            </svg>
          </button>
        </div>
        <div id="password-error" class="text-sm text-red-600 mb-4 hidden"></div>
        <button 
          id="password-submit-btn"
          class="w-full px-6 py-3 bg-black text-white font-medium hover:bg-gray-800 transition"
        >
          Access Admin
        </button>
      </div>
    </div>
  </div>
</div>

<section id="admin-content" class="py-16 bg-white hidden">
  <div class="max-w-4xl mx-auto px-6 sm:px-8 lg:px-12">
    <h1 class="text-3xl font-bold text-black mb-8">Create New Post</h1>
    
    <!-- Token Management Section -->
    <div class="border-2 border-black p-6 mb-8">
      <div class="text-xs font-bold text-black uppercase tracking-wider mb-4">
        GitHub Authentication
      </div>
      <div class="space-y-4">
        <div>
          <label for="github-token" class="block text-sm font-medium text-black mb-2">
            GitHub Personal Access Token
          </label>
          <input 
            type="password" 
            id="github-token" 
            placeholder="ghp_xxxxxxxxxxxx"
            class="w-full px-4 py-2 border border-gray-300 focus:border-black focus:outline-none text-sm"
          >
          <p class="text-xs text-gray-600 mt-2">
            Token is stored in your browser's localStorage. Only accessible on this device.
          </p>
        </div>
        <div>
          <label for="replicate-token" class="block text-sm font-medium text-black mb-2">
            Replicate API Token (for alt-text generation)
          </label>
          <input 
            type="password" 
            id="replicate-token" 
            placeholder="r8_xxxxxxxxxxxx"
            class="w-full px-4 py-2 border border-gray-300 focus:border-black focus:outline-none text-sm"
          >
          <p class="text-xs text-gray-600 mt-2">
            Optional. Used for automatic alt-text generation. <a href="https://replicate.com/account/api-tokens" target="_blank" class="underline">Get token</a>
          </p>
        </div>
        <div class="flex gap-3">
          <button 
            id="save-token-btn" 
            class="px-4 py-2 bg-black text-white text-sm font-medium hover:bg-gray-800 transition"
          >
            Save Tokens
          </button>
          <button 
            id="clear-token-btn" 
            class="px-4 py-2 border-2 border-black text-black text-sm font-medium hover:bg-gray-100 transition"
          >
            Clear Tokens
          </button>
        </div>
        <div id="token-status" class="text-sm"></div>
      </div>
    </div>

    <!-- Post Creation Form -->
    <form id="post-form" class="space-y-6">
      <!-- Post Type -->
      <div>
        <label class="block text-sm font-medium text-black mb-2">
          Post Type
        </label>
        <div class="flex gap-4">
          <label class="flex items-center">
            <input type="radio" name="post-type" value="post" checked class="mr-2">
            <span class="text-sm">Regular Post</span>
          </label>
          <label class="flex items-center">
            <input type="radio" name="post-type" value="photo" class="mr-2">
            <span class="text-sm">Photo Post</span>
          </label>
        </div>
      </div>

      <!-- Title -->
      <div>
        <label for="post-title" class="block text-sm font-medium text-black mb-2">
          Title <span class="text-gray-600">*</span>
        </label>
        <input 
          type="text" 
          id="post-title" 
          required
          class="w-full px-4 py-2 border border-gray-300 focus:border-black focus:outline-none"
        >
      </div>

      <!-- Date -->
      <div>
        <label for="post-date" class="block text-sm font-medium text-black mb-2">
          Date <span class="text-gray-600">*</span>
        </label>
        <input 
          type="date" 
          id="post-date" 
          required
          class="px-4 py-2 border border-gray-300 focus:border-black focus:outline-none"
        >
      </div>

      <!-- Content (for regular posts) -->
      <div id="content-section">
        <label for="post-content" class="block text-sm font-medium text-black mb-2">
          Content (Markdown) <span class="text-gray-600">*</span>
        </label>
        <!-- Markdown Toolbar -->
        <div class="border border-gray-300 border-b-0 bg-gray-50 p-2 flex flex-wrap gap-2">
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="bold" title="Bold">
            <strong>B</strong>
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="italic" title="Italic">
            <em>I</em>
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="link" title="Link">
            🔗 Link
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="heading" title="Heading">
            H
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="ul" title="Bullet List">
            • List
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="ol" title="Numbered List">
            1. List
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="code" title="Inline Code">
            &lt;/&gt;
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="blockquote" title="Quote">
            " Quote
          </button>
          <button type="button" class="markdown-btn px-3 py-1 text-sm border border-gray-300 hover:bg-white hover:border-black transition" data-action="hr" title="Horizontal Rule">
            ───
          </button>
        </div>
        <textarea 
          id="post-content" 
          rows="12"
          class="w-full px-4 py-2 border border-gray-300 focus:border-black focus:outline-none font-mono text-sm"
          placeholder="Write your post content in Markdown..."
        ></textarea>
      </div>

      <!-- Photo Post Section -->
      <div id="photo-section" class="hidden space-y-4">
        <div>
          <label class="block text-sm font-medium text-black mb-2">
            Image Mode
          </label>
          <div class="flex gap-4 mb-4">
            <label class="flex items-center">
              <input type="radio" name="image-mode" value="single" checked class="mr-2">
              <span class="text-sm">Single Image</span>
            </label>
            <label class="flex items-center">
              <input type="radio" name="image-mode" value="gallery" class="mr-2">
              <span class="text-sm">Gallery</span>
            </label>
          </div>
        </div>

        <!-- Single Image Upload -->
        <div id="single-image-section">
          <label for="single-image" class="block text-sm font-medium text-black mb-2">
            Image <span class="text-gray-600">*</span>
          </label>
          <input 
            type="file" 
            id="single-image" 
            accept="image/*"
            class="w-full px-4 py-2 border border-gray-300 focus:border-black focus:outline-none text-sm"
          >
          <div class="mt-2">
            <label for="single-alt-text" class="block text-sm font-medium text-black mb-2">
              Alt Text <span class="text-gray-600">*</span>
            </label>
            <div class="flex gap-2 mb-2">
              <input 
                type="text" 
                id="single-alt-text" 
                placeholder="Describe the image for accessibility"
                class="flex-1 px-4 py-2 border border-gray-300 focus:border-black focus:outline-none text-sm"
              >
              <button 
                type="button" 
                id="generate-single-alt-btn" 
                class="px-4 py-2 border-2 border-black text-black text-sm font-medium hover:bg-gray-100 transition whitespace-nowrap"
              >
                Generate Alt Text
              </button>
            </div>
            <label for="single-caption" class="block text-sm font-medium text-black mb-2">
              Caption (optional)
            </label>
            <input 
              type="text" 
              id="single-caption" 
              placeholder="Optional caption for the image"
              class="w-full px-4 py-2 border border-gray-300 focus:border-black focus:outline-none text-sm"
            >
          </div>
        </div>

        <!-- Gallery Images -->
        <div id="gallery-section" class="hidden">
          <label class="block text-sm font-medium text-black mb-2">
            Images <span class="text-gray-600">*</span>
          </label>
          <input 
            type="file" 
            id="gallery-images" 
            accept="image/*"
            multiple
            class="w-full px-4 py-2 border border-gray-300 focus:border-black focus:outline-none text-sm mb-4"
          >
          <div id="gallery-preview" class="space-y-4"></div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <button 
          type="submit" 
          id="submit-btn"
          class="px-6 py-3 bg-black text-white font-medium hover:bg-gray-800 transition"
        >
          Create Post
        </button>
        <div id="status-message" class="mt-4 text-sm"></div>
      </div>
    </form>
  </div>
</section>

<script src="{{ '/assets/js/admin.js' | relative_url }}"></script>
<script>
// Password protection - runs before admin.js
// 
// SETUP INSTRUCTIONS:
// 1. Choose a password (e.g., "mypassword123")
// 2. Generate its SHA-256 hash using one of these methods:
//    - Terminal: echo -n "your-password" | shasum -a 256
//    - Online: https://emn178.github.io/online-tools/sha256.html
//    - Node.js: require('crypto').createHash('sha256').update('your-password').digest('hex')
// 3. Copy the GENERATED HASH (a long string of letters/numbers) and paste it below
// 4. Replace the hash value between the quotes (keep the quotes!)
//
// IMPORTANT: Replace the hash below with your password's SHA-256 hash
// Generate hash: echo -n "your-password" | shasum -a 256
// Or use: https://emn178.github.io/online-tools/sha256.html
// Make sure to remove any spaces or newlines from the hash
const ADMIN_PASSWORD_HASH = '4759f5710bdae609ddeee7963a5da6f6d6d80832c6fdeb0cb21613bca8a94cc3'; // PASTE YOUR PASSWORD'S HASH HERE (not the password itself!)
const AUTH_SESSION_KEY = 'admin_authenticated';

async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  // Check if already authenticated in this session
  const isAuthenticated = sessionStorage.getItem(AUTH_SESSION_KEY) === 'true';
  
  if (isAuthenticated) {
    showAdminContent();
    // Don't try to initialize here - let admin.js handle it
    // admin.js will detect that admin-content is visible and initialize
    return;
  }

  // Show password prompt
  const overlay = document.getElementById('password-overlay');
  const passwordInput = document.getElementById('admin-password');
  const submitBtn = document.getElementById('password-submit-btn');
  const errorDiv = document.getElementById('password-error');

  // Toggle password visibility
  const togglePasswordBtn = document.getElementById('toggle-password');
  const eyeIcon = document.getElementById('eye-icon');
  const eyeOffIcon = document.getElementById('eye-off-icon');
  
  if (togglePasswordBtn && eyeIcon && eyeOffIcon && passwordInput) {
    // Use a simple, direct approach that always works
    togglePasswordBtn.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      const currentType = passwordInput.type || 'password';
      const newType = currentType === 'password' ? 'text' : 'password';
      passwordInput.type = newType;
      eyeIcon.classList.toggle('hidden');
      eyeOffIcon.classList.toggle('hidden');
      return false;
    };
    
    // Also handle mousedown to catch clicks that might be missed
    togglePasswordBtn.onmousedown = function(e) {
      e.preventDefault();
      return false;
    };
    
    // Ensure button is always enabled and clickable
    togglePasswordBtn.disabled = false;
    togglePasswordBtn.style.pointerEvents = 'auto';
    togglePasswordBtn.style.cursor = 'pointer';
  }

  passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      checkPassword();
    }
  });

  submitBtn.addEventListener('click', checkPassword);

  async function checkPassword() {
    const password = passwordInput.value;
    if (!password) {
      errorDiv.textContent = 'Please enter a password';
      errorDiv.classList.remove('hidden');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking...';

    try {
      const hash = await hashPassword(password);
      // Trim and lowercase both hashes for comparison (in case of whitespace or case issues)
      const enteredHash = hash.trim().toLowerCase();
      const storedHash = ADMIN_PASSWORD_HASH.trim().toLowerCase();
      
      if (enteredHash === storedHash) {
        sessionStorage.setItem(AUTH_SESSION_KEY, 'true');
        showAdminContent();
      } else {
        errorDiv.textContent = 'Incorrect password. Make sure you typed your password (not the hash) and that the hash in the code matches your password.';
        errorDiv.classList.remove('hidden');
        passwordInput.value = '';
        passwordInput.focus();
      }
    } catch (error) {
      errorDiv.textContent = 'Error checking password: ' + error.message;
      errorDiv.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Access Admin';
    }
  }

  function showAdminContent() {
    overlay.classList.add('hidden');
    document.getElementById('admin-content').classList.remove('hidden');
  }

  // Focus password input
  passwordInput.focus();
});
</script>
