name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/752835748650/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1074514827@darjix-website.iam.gserviceaccount.com'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Production Site
        run: npm run build:production

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project darjix-website



