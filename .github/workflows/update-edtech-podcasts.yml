name: Update EdTech Podcasts

on:
  schedule:
    # Run on Mondays at 9am UTC (1 = Monday in cron)
    # This is 4:00 AM EST (EST is UTC-5, so 4:00 AM EST = 9:00 AM UTC)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-podcasts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Run EdTech Podcast Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          python scripts/edtech_podcast_agent.py
      
      - name: Commit and push changes
        id: commit_step
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _includes/edtech-podcasts.md || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update: EdTech Podcasts - $(date +'%B %d, %Y')"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Firebase Hosting Deploy
        if: steps.commit_step.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run firebase-hosting-deploy.yml --ref main

