name: Update EdTech Podcasts

on:
  schedule:
    # Run daily at 4:00 AM EST (9:00 AM UTC)
    # EST is UTC-5, so 4:00 AM EST = 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-podcasts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Run EdTech Podcast Agent
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_MODEL: deepseek-ai/deepseek-r1
        run: |
          python scripts/edtech_podcast_agent.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _includes/edtech-podcasts.md || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: EdTech Podcasts - $(date +'%B %d, %Y')" && git pull --rebase origin main && git push origin HEAD:main)
      
      - name: Trigger Pages rebuild
        if: success()
        run: |
          # Wait a moment for the push to be fully processed
          sleep 5
          # Trigger Pages workflow via GitHub API (workflow_dispatch)
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}')
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" != "204" ]; then
            echo "⚠️  API trigger returned HTTP $http_code. Pages workflow should still trigger automatically on push."
          else
            echo "✅ Successfully triggered Pages workflow via API"
          fi

