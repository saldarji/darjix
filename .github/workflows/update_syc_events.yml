name: Update SYC Events

on:
  schedule:
    # 6:00 AM UTC = 2:00 AM ET — runs nightly
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright beautifulsoup4

      # Install Chrome (not just Chromium headless shell) so channel="chrome" works
      - name: Install Chrome for Playwright
        run: python -m playwright install --with-deps chrome

      - name: Scrape events
        run: python scripts/scrape_syc_events.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/syc_events.json
          git diff --cached --quiet || git commit -m "chore: update SYC events [skip ci]"
          git push
