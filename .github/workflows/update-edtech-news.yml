name: Update EdTech News

on:
  schedule:
    # Run on Mondays at 9am UTC (1 = Monday in cron)
    - cron: '0 9 * * 1'
    # Test run: 1:40 PM ET (18:40 UTC) - can be removed after testing
    - cron: '40 18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Run EdTech News Agent (full automation)
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/edtech_news_agent.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _includes/edtech-news.md scripts/news_candidates.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: EdTech News - $(date +'%B %d, %Y')" && git push origin HEAD:main)
