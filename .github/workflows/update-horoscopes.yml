name: Update Horoscopes

on:
  schedule:
    # Mondays 9am UTC (same slot as EdTech news)
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-horoscopes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run horoscope agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/horoscope_agent.py

      - name: Commit and push changes
        id: commit_step
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/horoscopes.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update: Horoscopes - $(date +'%B %d, %Y')"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Firebase Hosting Deploy
        if: steps.commit_step.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run firebase-hosting-deploy.yml --ref main
